<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <title>Мои задачи</title>
</head>
<body>

<h1 class="test-title">Список задач</h1>

<div class = "refresh-container">
    <button class="btn-refresh" onclick="window.location.reload()">Обновить страницу</button>
</div>

<form class="add-form" action="/add" method="POST">
    <input type="text" name="task_name">
    <button type="submit">Добавить</button>
</form>

<ul class="task-list">
    {% for task in tasks %}

    <li id="task-card {{ loop.index0 }}" class="{% if task.done %}task-done{% else %}task-pending{% endif %}">
        <h3>{{ task.name }}</h3>
        <div>
            Приоритет:
            <select class="card-priority">
                <option value="Высокий" {% if task.priority == 'Высокий' %}selected{% endif %}>Высокий</option>
                <option value="Обычный" {% if task.priority == 'Обычный' %}selected{% endif %}>Обычный</option>
                <option value="Низкий" {% if task.priority == 'Низкий' %}selected{% endif %}>Низкий</option>
            </select>
            {% if task.done %}
                <b>(Выполнено)</b>

    {% else %}
    <b>(Не выполнено)</b>
    {% endif %}
        </div>
        <div class="card-action">
            <form class="toggle-form" action="/toggle" method="post" id="toggle-form {{ task.id }}">
        <input type="hidden" name="task_id" value="{{ task.id }}">
        <button class="btn-toggle {% if task.done %}btn-undo{% else %}btn-do{% endif %}" type="submit">
            {% if task.done %}
            Отменить
            {% else %}
            Выполнить
            {% endif %}
        </button>
    </form>
    <form class="delete-form" action="/delete" method="post">
        <input type="hidden" name="task_id" value="{{ task.id }}">
        <button class="btn-delete" type="submit">Удалить</button>
    </form>
        </div>
    </li>
    {% endfor %}
</ul>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
