<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <title>Мои задачи</title>
</head>
<body>

<h1>Список задач</h1>

<div class = "refresh-container">
    <button class="btn-refresh" onclick="window.location.reload()">Обновить страницу</button>
</div>

<form class="add-form" action="/add" method="POST">
    <input type="text" name="task_name">
    <button type="submit">Добавить</button>
</form>


<ul>
    {% for task in tasks %}

    <li class="{% if task.done %}task-done{% else %}task-pending{% endif %}">
        <h3>{{ task.name }}</h3>
        <div>
            Приоритет: {{ task.priority }}
            {% if task.done %}
                <b>(Выполнено)</b>

    {% else %}
    <b>(Не выполнено)</b>
    {% endif %}
        </div>
    <form class="delete-form" action="/delete" method="post">
        <input type="hidden" name="task_index" value="{{ loop.index0 }}">
        <button class="btn-delete" type="submit">Удалить</button>
    </form>
    </li>
    {% endfor %}
</ul>

</body>
</html>
