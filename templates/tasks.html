<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <title>Мои задачи</title>
</head>
<body>

<h1>Список задач</h1>

<button onclick="window.location.reload()">Обновить страницу</button>

<form action="/add" method="POST">
    <input type="text" name="task_name">
    <button type="submit">Добавить</button>
</form>


<ul>
    {% for task in tasks %}

    <li class="{% if task.done %}task-done{% else %}task-pending{% endif %}">{{ task.name }} - Приоритет: {{ task.priority }}
            {% if task.done %}
                <b>(Выполнено)</b>

    {% else %}
    <b>(Не выполнено)</b>

    {% endif %}
    </li>
    {% endfor %}
</ul>

</body>
</html>
